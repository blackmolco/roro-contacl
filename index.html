<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba — Teoría del Estado</title>
<style>
  :root{
    --dark-blue:#1F3864;
    --med-blue:#2E75B6;
    --light-blue:#D6E4F0;
    --light-gray:#F2F2F2;
    --green:#2E7D32;
    --green-bg:#E8F5E9;
    --red:#C62828;
    --red-bg:#FDECEA;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light-gray);
    margin:0;
    padding:0;
    color:#222;
  }
  header{
    background:var(--dark-blue);
    color:var(--white);
    padding:28px 24px 22px;
    text-align:center;
  }
  header h1{margin:0 0 6px;font-size:26px;}
  header p{margin:0;font-size:14px;color:#cfe0f5;}
  .container{
    max-width:860px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  .tabs{
    display:flex;
    gap:10px;
    margin:18px 0 22px;
  }
  .tab-btn{
    flex:1;
    padding:14px 10px;
    border:2px solid var(--med-blue);
    background:var(--white);
    color:var(--dark-blue);
    font-weight:bold;
    font-size:15px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn.active{
    background:var(--med-blue);
    color:var(--white);
  }
  .scorebar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--white);
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:18px;
    font-size:14px;
    color:var(--dark-blue);
    font-weight:bold;
  }
  .scorebar button{
    background:var(--dark-blue);
    color:var(--white);
    border:none;
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    font-weight:bold;
  }
  .scorebar button:hover{background:var(--med-blue);}
  .section{display:none;}
  .section.active{display:block;}
  .qcard{
    background:var(--white);
    border:1px solid #ddd;
    border-left:5px solid var(--med-blue);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .qnum{
    display:inline-block;
    background:var(--light-blue);
    color:var(--dark-blue);
    font-size:12px;
    font-weight:bold;
    padding:3px 9px;
    border-radius:12px;
    margin-bottom:8px;
  }
  .qtext{
    font-size:15.5px;
    font-weight:bold;
    color:#222;
    margin-bottom:14px;
    line-height:1.4;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt-btn{
    text-align:left;
    padding:11px 14px;
    border:2px solid #ccc;
    background:var(--white);
    border-radius:7px;
    cursor:pointer;
    font-size:14.5px;
    color:#222;
    transition:.12s;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--med-blue);background:#F7FBFF;}
  .opt-btn:disabled{cursor:default;}
  .opt-btn.correct{
    background:var(--green-bg);
    border-color:var(--green);
    color:var(--green);
    font-weight:bold;
  }
  .opt-btn.incorrect{
    background:var(--red-bg);
    border-color:var(--red);
    color:var(--red);
    font-weight:bold;
  }
  .feedback{
    margin-top:12px;
    padding:12px 14px;
    border-radius:7px;
    font-size:14px;
    line-height:1.45;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green);}
  .feedback.bad{background:var(--red-bg);color:var(--red);border:1px solid var(--red);}
  .feedback b{color:inherit;}
  footer{
    text-align:center;
    color:#888;
    font-size:12px;
    padding:18px 0 30px;
  }
</style>
</head>
<body>

<header>
  <h1>Prueba de Teoría del Estado</h1>
  <p>Derecho Político · Verdadero/Falso y Selección Múltiple · Preguntas y opciones aleatorias en cada apertura</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab-btn active" data-tab="vf">Verdadero / Falso</button>
    <button class="tab-btn" data-tab="mc">Selección Múltiple</button>
  </div>

  <div class="scorebar">
    <span id="scoreLabel">Puntaje: 0 / 0</span>
    <button id="reshuffleBtn">🔀 Volver a mezclar</button>
  </div>

  <div class="section active" id="section-vf"></div>
  <div class="section" id="section-mc"></div>

</div>

<footer>Material de apoyo académico — Teoría del Estado · Generado para estudio personal</footer>

<script>
// ════════════════════════════════════════════
// BANCO DE PREGUNTAS — VERDADERO / FALSO
// ════════════════════════════════════════════

  { text: "El concepto «Estado» fue utilizado por primera vez por Nicolás Maquiavelo, quien empleó la expresión «lo Stato» en su obra «El Príncipe» (siglo XVI).", answer: true,

// ════════════════════════════════════════════
// BANCO DE PREGUNTAS — SELECCIÓN MÚLTIPLE
// ════════════════════════════════════════════
const bancoMC = [
  { text: "¿Quién utilizó por primera vez el concepto «lo Stato» en el siglo XVI?",

// ════════════════════════════════════════════
// LÓGICA: aleatorización, render, evaluación
// ════════════════════════════════════════════
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let totalAnswered = 0;
let totalCorrect = 0;

function updateScore(){
  document.getElementById('scoreLabel').textContent = `Puntaje: ${totalCorrect} / ${totalAnswered}`;
}

function renderVF(){
  const data = shuffle(bancoVF);
  const container = document.getElementById('section-vf');
  container.innerHTML = '';
  data.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    const orderedOptions = Math.random() < 0.5 ? [true, false] : [false, true];
    card.innerHTML = `
      <div class="qnum">Pregunta ${idx+1} de ${data.length}</div>
      <div class="qtext">${q.text}</div>
      <div class="options">
        ${orderedOptions.map(val => `<button class="opt-btn" data-val="${val}">${val ? 'VERDADERO' : 'FALSO'}</button>`).join('')}
      </div>
      <div class="feedback"></div>
    `;
    const buttons = card.querySelectorAll('.opt-btn');
    const feedback = card.querySelector('.feedback');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const chosen = btn.getAttribute('data-val') === 'true';
        buttons.forEach(b => b.disabled = true);
        totalAnswered++;
        if(chosen === q.answer){
          btn.classList.add('correct');
          totalCorrect++;
          feedback.className = 'feedback show ok';
          feedback.innerHTML = `<b>¡Correcto!</b> ${q.explain}`;
        } else {
          btn.classList.add('incorrect');
          buttons.forEach(b => { if((b.getAttribute('data-val')==='true') === q.answer) b.classList.add('correct'); });
          feedback.className = 'feedback show bad';
          feedback.innerHTML = `<b>Incorrecto.</b> La respuesta correcta es <b>${q.answer ? 'VERDADERO' : 'FALSO'}</b>. ${q.explain}`;
        }
        updateScore();
      });
    });
    container.appendChild(card);
  });
}

function renderMC(){
  const data = shuffle(bancoMC);
  const container = document.getElementById('section-mc');
  container.innerHTML = '';
  data.forEach((q, idx) => {
    const correctText = q.options[q.correctIndex];
    const shuffledOptions = shuffle(q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correctIndex })));
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qnum">Pregunta ${idx+1} de ${data.length}</div>
      <div class="qtext">${q.text}</div>
      <div class="options">
        ${shuffledOptions.map((opt, i) => `<button class="opt-btn" data-correct="${opt.isCorrect}">${String.fromCharCode(97+i)}) ${opt.text}</button>`).join('')}
      </div>
      <div class="feedback"></div>
    `;
    const buttons = card.querySelectorAll('.opt-btn');
    const feedback = card.querySelector('.feedback');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const isCorrect = btn.getAttribute('data-correct') === 'true';
        buttons.forEach(b => b.disabled = true);
        totalAnswered++;
        if(isCorrect){
          btn.classList.add('correct');
          totalCorrect++;
          feedback.className = 'feedback show ok';
          feedback.innerHTML = `<b>¡Correcto!</b> ${q.explain}`;
        } else {
          btn.classList.add('incorrect');
          buttons.forEach(b => { if(b.getAttribute('data-correct')==='true') b.classList.add('correct'); });
          feedback.className = 'feedback show bad';
          feedback.innerHTML = `<b>Incorrecto.</b> La respuesta correcta es <b>"${correctText}"</b>. ${q.explain}`;
        }
        updateScore();
      });
    });
    container.appendChild(card);
  });
}

function renderAll(){
  totalAnswered = 0;
  totalCorrect = 0;
  updateScore();
  renderVF();
  renderMC();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('section-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('reshuffleBtn').addEventListener('click', renderAll);

renderAll();
</script>
</body>
</html>
